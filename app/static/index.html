<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortReel — Podcast to Short Reel Studio</title>
    <meta name="description" content="Transform your podcast into viral short reels with AI-powered clip extraction and manual editing.">
    <meta name="theme-color" content="#09090c">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Design system -->
    <link rel="stylesheet" href="/assets/app/styles/main.css?v=2">
</head>
<body>
    <!-- Compact 64px wizard — always visible when not on Home -->
    <div id="wizard-root" role="navigation" aria-label="Progress wizard"></div>

    <!-- Single active workspace — one page at a time -->
    <main id="app" role="main" aria-live="polite"></main>

    <!-- Portal roots for overlays, drawers, command bar -->
    <div id="overlay-root" aria-live="polite"></div>
    <div id="drawer-root"></div>
    <div id="cmdbar-root" role="dialog" aria-label="Command bar" aria-modal="true"></div>

    <!-- App entry point (ES module) -->
    <script type="module" src="/assets/app/state.js"></script>
</body>
</html>
